<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - SmartShop</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
</head>
<body>
<nav class="navbar">
  <div class="navbar-inner">
    <a class="navbar-brand" href="{{ url_for('products.index') }}">SmartShop</a>
    <div class="navbar-links">
      <a href="{{ url_for('products.list_products') }}">Products</a>
      <a href="{{ url_for('auth.register') }}">Register</a>
    </div>
  </div>
</nav>

<div class="flash-container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
  {% endwith %}
</div>

<form class="form-box" method="post">
  <h2>Login to SmartShop</h2>
  <div class="form-group">
    <label>Email</label>
    <input type="email" name="email" required>
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" name="password" required>
  </div>
  <button type="submit" class="btn btn-primary btn-full">Login</button>
  <p style="margin-top:14px; font-size:14px;">Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a></p>
  <!-- <p style="font-size:12px; color:#94a3b8;">Admin demo login: admin@smartshop.com / admin123</p> -->
</form>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
